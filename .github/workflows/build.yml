name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan proyek Android
        run: |
          HTML=$(ls *.html | grep -v '^jadwal.html$' | head -n 1)
          mkdir -p app/src/main/java/com/zryalya/pemikiran app/src/main/assets app/src/main/res/values
          cp "$HTML" app/src/main/assets/index.html
          cp jadwal.html app/src/main/assets/jadwal.html
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PemikiranPolitikIslam"
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          E
          cat > gradle.properties <<'E'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          E
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zryalya.pemikiran'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.zryalya.pemikiran'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          E
          cat > app/src/main/res/values/strings.xml <<'E'
          <resources><string name="app_name">Pemikiran Politik Islam</string></resources>
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          E
          cat > app/src/main/java/com/zryalya/pemikiran/MainActivity.java <<'E'
          package com.zryalya.pemikiran;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              private static final String BTN =
                  "(function(){if(document.getElementById('zj-btn'))return;"
                  + "var a=document.createElement('a');a.id='zj-btn';a.href='jadwal.html';"
                  + "a.textContent='\uD83D\uDCC5 Jadwal';"
                  + "a.style.cssText='position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));"
                  + "z-index:99999;padding:12px 18px;border-radius:999px;"
                  + "background:linear-gradient(120deg,#ff3cac,#784ba0,#2b86c5);color:#fff;"
                  + "font:600 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.4)';"
                  + "document.body.appendChild(a);})();";

              class Bridge {
                  @JavascriptInterface
                  public String getSchedule() {
                      return Sched.load(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void saveSchedule(String json) {
                      Sched.save(MainActivity.this, json);
                  }

                  @JavascriptInterface
                  public void test() {
                      Sched.notify(MainActivity.this, "Tes notifikasi", "Notifikasi jadwal matkul sudah aktif.", 1);
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0a0818"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0a0818"));
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  Sched.scheduleAll(this);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0a0818"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          if (url != null && url.endsWith("index.html")) v.evaluateJavascript(BTN, null);
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          E
          cat > app/src/main/java/com/zryalya/pemikiran/Sched.java <<'E'
          package com.zryalya.pemikiran;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Calendar;

          public class Sched {
              static final String CH = "jadwal";

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("jadwal", Context.MODE_PRIVATE);
              }

              static String load(Context c) {
                  return prefs(c).getString("data", "[]");
              }

              static void save(Context c, String json) {
                  cancelAll(c);
                  prefs(c).edit().putString("data", json).apply();
                  scheduleAll(c);
              }

              static void cancelAll(Context c) {
                  try {
                      JSONArray a = new JSONArray(load(c));
                      for (int i = 0; i < a.length(); i++) cancel(c, a.getJSONObject(i));
                  } catch (Exception e) { }
              }

              static void scheduleAll(Context c) {
                  try {
                      JSONArray a = new JSONArray(load(c));
                      for (int i = 0; i < a.length(); i++) schedule(c, a.getJSONObject(i));
                  } catch (Exception e) { }
              }

              static int code(JSONObject o) throws Exception {
                  return (int) (o.getLong("id") % 2000000000L);
              }

              static PendingIntent pi(Context c, JSONObject o) throws Exception {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.putExtra("item", o.toString());
                  return PendingIntent.getBroadcast(c, code(o), i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static long next(JSONObject o) throws Exception {
                  int day = o.getInt("day");
                  String[] t = o.getString("jam").split(":");
                  int h = Integer.parseInt(t[0]);
                  int m = Integer.parseInt(t[1]);
                  int before = o.optInt("menit", 10);
                  long now = System.currentTimeMillis();
                  Calendar c = Calendar.getInstance();
                  c.set(Calendar.HOUR_OF_DAY, h);
                  c.set(Calendar.MINUTE, m);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  for (int d = 0; d < 8; d++) {
                      if (c.get(Calendar.DAY_OF_WEEK) == day) {
                          long trig = c.getTimeInMillis() - before * 60000L;
                          if (trig > now + 1000) return trig;
                      }
                      c.add(Calendar.DAY_OF_MONTH, 1);
                  }
                  return -1;
              }

              static void schedule(Context c, JSONObject o) {
                  try {
                      long when = next(o);
                      if (when < 0) return;
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      PendingIntent p = pi(c, o);
                      boolean exact = Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms();
                      if (exact) {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, p);
                      } else {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, p);
                      }
                  } catch (Exception e) { }
              }

              static void cancel(Context c, JSONObject o) {
                  try {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      am.cancel(pi(c, o));
                  } catch (Exception e) { }
              }

              static void notify(Context c, String title, String text, int id) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Jadwal Matkul", NotificationManager.IMPORTANCE_HIGH));
                  PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CH)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new Notification.BigTextStyle().bigText(text))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build();
                  nm.notify(id, n);
              }
          }
          E
          cat > app/src/main/java/com/zryalya/pemikiran/AlarmReceiver.java <<'E'
          package com.zryalya.pemikiran;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import org.json.JSONObject;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  try {
                      JSONObject o = new JSONObject(i.getStringExtra("item"));
                      String ruang = o.optString("ruang", "");
                      int mnt = o.optInt("menit", 10);
                      String text = "Jam " + o.getString("jam");
                      if (!ruang.isEmpty()) text += " - Ruang " + ruang;
                      if (mnt > 0) text += " (" + mnt + " menit lagi)";
                      Sched.notify(c, "Matkul: " + o.getString("nama"), text, Sched.code(o));
                      Sched.schedule(c, o);
                  } catch (Exception e) { }
              }
          }
          E
          cat > app/src/main/java/com/zryalya/pemikiran/BootReceiver.java <<'E'
          package com.zryalya.pemikiran;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  Sched.scheduleAll(c);
              }
          }
          E
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pemikiran-politik-islam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
